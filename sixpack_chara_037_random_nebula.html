<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>シックスパックになりたい - Zoom Layered Cosmos</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d8d8d8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      touch-action: none;
      user-select: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #phone {
      width: min(100vw, 430px);
      aspect-ratio: 9 / 16;
      max-height: 100vh;
      background: #fff8e7;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #ui {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 12px 14px;
      background: linear-gradient(to top, rgba(255, 248, 231, 0.96), rgba(255, 248, 231, 0.65));
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      pointer-events: auto;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 4px;
      font-weight: 700;
      font-size: 14px;
      color: #4b3a2b;
      background: #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.14);
    }

    button:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 2px 5px rgba(0,0,0,0.14);
    }

    #caption {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      color: #4b3a2b;
      font-weight: 800;
      font-size: 18px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.8);
      pointer-events: none;
    }

    #message {
      position: absolute;
      left: 18px;
      right: 18px;
      top: 48px;
      min-height: 32px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.75);
      color: #6a4a35;
      text-align: center;
      font-weight: 700;
      opacity: 0;
      transform: translateY(-8px);
      transition: 0.25s;
      pointer-events: none;
    }

    #message.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <main id="phone">
    <canvas id="game"></canvas>
    <!-- <div id="caption">シックスパックになりたい</div> -->
    <div id="message">シックスパックになりたい〜!!</div>
    <div id="ui">
      <button id="todayBtn">きょう</button>
      <button id="waveBtn">重力波</button>
      <button id="stoneBtn">ズーム</button>
      <button id="foodBtn">エネルギー</button>
    </div>
  </main>

  <script>
    const phone = document.getElementById("phone");
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const message = document.getElementById("message");

    const world = {
      width: 390,
      height: 694,
      // 宇宙そのものは画面より広い。画面はカメラでのぞく。
      spaceWidth: 390 * 2.25,
      spaceHeight: 694 * 2.25,
      groundY: 585,
      mode: "wind",
      time: 0,
      shake: 0,
      wind: { x: 0, y: 0 },
      camera: { x: 390 / 2, y: 694 * 0.47, zoom: 1, targetZoom: 1 },
      zoomMin: 0.46,
      zoomMax: 1.08,
      // 下向き重力ではなく、生き物の「自分で動く感じ」を中心にする
      drift: 0.08, //drift: 0.028,
      spaceReady: false,
      started: false,
      introTime: 0,
      cameraMode: "auto",
      focusTarget: null,
      focusTimer: 0,

      statsOpen: false,
      dayTimer: 0,

      stats: {
        sixpack: 0,
        wakuVisits: 0,
        spikesGone: 0,
        focusCounts: {}
      },

      waku: {
        active: false,
        timer: 0,
        wait: 600,
        duration: 900,
        x: 0,
        y: 0,
        startX: 0,
        startY: 0,
        endX: 0,
        endY: 0,
        curveX: 0,
        curveY: 0,
        strength: 0.020,
        swirl: 0.012,
        r: 56
      },

    phase: "free",
    phaseTimer: 0,
    gatherDuration: 240, // 約4秒
    freeDuration: 1800,   // 約30秒
    };

    const characters = [
      { name: "タッヒー", color: "#ffb3d1", x: 90,  y: 220, r: 24, vx: 0.2, vy: 0.0, mood: "tahhi", dir: 1, action: "pause", actionTimer: 80, antenna: 0 },
      { name: "なりりん", color: "#8bd1ff", x: 270, y: 210, r: 27, vx: -0.15, vy: 0.0, mood: "naririn", softness: 0, feeler: 0 },
      { name: "クッスー", color: "#c7a4ff", x: 140, y: 350, r: 25, vx: 0.08, vy: -0.04, mood: "kussu", sway: 0, sleep: 0 },
      { name: "タヒりん", color: "#ffce73", x: 260, y: 365, r: 24, vx: -0.35, vy: 0.0, mood: "tahirin", dirX: -1, dirY: 0, robotTimer: 60, blink: 0 },
      { name: "たいたい", color: "#9be08f", x: 110, y: 505, r: 26, vx: 0.2, vy: -0.8, mood: "taitai", hopTimer: 20, squash: 0 },
      { name: "パークーパークー", color: "#ffb68a", x: 250, y: 505, r: 30, vx: 0.4, vy: -0.1, mood: "paaku", phase: 0 },
    ];

    const images = {
      tahhi: new Image(),
      naririn: new Image(),
      kussu: new Image(),
      tahirin: new Image(),
      taitai: new Image(),
      paaku: new Image(),
    };

    images.tahhi.src = "tahhi.png";
    images.naririn.src = "naririn.png";
    images.kussu.src = "kussu.png";
    images.tahirin.src = "tahirin.png";
    images.taitai.src = "taitai.png";
    images.paaku.src = "paaku.png";

    images.spike = new Image();
    images.spike.src = "spike.png";

    images.wakuwaku = new Image();  
    images.wakuwaku.src = "wakuwaku.png";

    images.title = new Image();
    images.title.src = "title.png";

    const stones = [];
    const foods = [];
    const spikes = [];
    const bubbles = Array.from({ length: 24 }, () => ({
      x: Math.random() * world.spaceWidth,
      y: Math.random() * world.spaceHeight,
      r: 2 + Math.random() * 6,
      speed: 0.15 + Math.random() * 0.35,
    }));

    // 背景は2層化する。
    // farStars は画面固定の遠景、worldStars はキャラと同じ宇宙空間にある近景。
    const farStars = Array.from({ length: 100 }, () => ({
      x: Math.random(),
      y: Math.random(),
      r: 0.5 + Math.random() * 1.4,
      tw: Math.random() * Math.PI * 2,
    }));

    const worldStars = Array.from({ length: 95 }, () => ({
      x: Math.random(),
      y: Math.random(),
      r: 1 + Math.random() * 3.2,
      tw: Math.random() * Math.PI * 2,
      hue: Math.random(),
    }));

    const nebulaPalette = [
      "rgba(255,175,255,0.15)",
      "rgba(170,220,255,0.13)",
      "rgba(255,235,170,0.10)",
      "rgba(190,255,220,0.11)",
      "rgba(255,180,210,0.10)"
    ];

    function createNebulas() {
      return Array.from({ length: 5 }, () => ({
        x: Math.random() * world.spaceWidth,
        y: Math.random() * world.spaceHeight,
        r: 180 + Math.random() * 180,
        color: nebulaPalette[Math.floor(Math.random() * nebulaPalette.length)]
      }));
    }

    world.nebulas = createNebulas();


    function resize() {
      const rect = phone.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      world.width = rect.width;
      world.height = rect.height;
      world.spaceWidth = rect.width * 2.25;
      world.spaceHeight = rect.height * 2.25;
      world.groundY = world.spaceHeight * 0.83;

      // 初回だけ、既存キャラを広い宇宙の中央付近へ移す。
      if (!world.spaceReady) {
        const dx = (world.spaceWidth - rect.width) / 2;
        const dy = (world.spaceHeight - rect.height) / 2;
        characters.forEach(ch => {
          ch.x += dx;
          ch.y += dy;
        });
        world.camera.x = world.spaceWidth / 2;
        world.camera.y = world.spaceHeight * 0.47;
        world.camera.zoom = 1;
        world.camera.targetZoom = 1;
        world.spaceReady = true;
        world.nebulas = createNebulas();
      }
    }

    window.addEventListener("resize", resize);
    resize();

    function showMessage(text) {
      message.textContent = text;
      message.classList.add("show");
      clearTimeout(showMessage.timer);
      showMessage.timer = setTimeout(() => message.classList.remove("show"), 1400);
    }

    function setMode(mode) {
      world.mode = mode;
      showMessage(mode === "wind" ? "スワイプで宇宙風" : mode === "wave" ? "タップで重力波" : mode === "stone" ? "タップした場所に星" : "タップした場所にエネルギー");
    }

    function startRandomFocus() {
      if (!world.started) return;

      //const targets = characters.filter(ch => ch.mood !== "paaku");
      const targets = characters;
      if (targets.length === 0) return;

      const target = targets[Math.floor(Math.random() * targets.length)];

      world.cameraMode = "focus";
      world.focusTarget = target;
      world.focusTimer = 480; // 約8秒

      world.stats.focusCounts[target.name] =
        (world.stats.focusCounts[target.name] || 0) + 1;

      showMessage(target.name + " をみている");
    }

    document.getElementById("todayBtn").onclick = () => {
      world.statsOpen = !world.statsOpen;
    };
    document.getElementById("waveBtn").onclick = () => setMode("wave");
    document.getElementById("stoneBtn").onclick = () => startRandomFocus();
    document.getElementById("foodBtn").onclick = () => setMode("food");

    let pointerStart = null;

    canvas.addEventListener("pointerdown", (e) => {
      if (!world.started) {
        world.started = true;

        const paaku = characters.find(ch => ch.mood === "paaku");
        if (paaku) {
          paaku.vx = 3.2;
          paaku.vy = -1.0;
        }

        showMessage("スタート！");
        return;
      }

      const p = getPoint(e);
      pointerStart = p;

      if (world.mode === "stone") {
        stones.push({ x: p.x, y: p.y, r: 16 + Math.random() * 13, spin: Math.random() * Math.PI * 2, points: 5 + Math.floor(Math.random() * 3) });
        showMessage("星を置いた");
      }

      if (world.mode === "food") {
        foods.push({ x: p.x, y: p.y, r: 10, life: 900 });
        showMessage("きらきらエネルギーを置いた");
      }

      if (world.mode === "wave") {
        makeWave(p.x, p.y);
      }
    });

    canvas.addEventListener("pointerup", (e) => {
      if (!pointerStart || world.mode !== "wind") return;
      const p = getPoint(e);
      const dx = p.x - pointerStart.x;
      const dy = p.y - pointerStart.y;
      const power = Math.min(Math.hypot(dx, dy) / 18, 10);
      world.wind.x += dx * 0.012;
      world.wind.y += dy * 0.012;
      characters.forEach(ch => {
        ch.vx += dx * 0.004 * (ch.mood === "heavy" ? 0.45 : 1);
        ch.vy += dy * 0.004 * (ch.mood === "heavy" ? 0.45 : 1);
      });
      if (power > 2) showMessage("宇宙風が吹いた〜");
    });

    function getPoint(e) {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      return screenToWorld(sx, sy);
    }

    function screenToWorld(sx, sy) {
      return {
        x: (sx - world.width / 2) / world.camera.zoom + world.camera.x,
        y: (sy - world.height / 2) / world.camera.zoom + world.camera.y,
      };
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function makeWave(x, y) {
      world.shake = 12;
      characters.forEach(ch => {
        const dx = ch.x - x;
        const dy = ch.y - y;
        const d = Math.max(Math.hypot(dx, dy), 1);
        const force = Math.max(0, 8 - d / 40);
        ch.vx += (dx / d) * force;
        ch.vy += (dy / d) * force - 2;
      });

      spikes.forEach(sp => {
        const dx = sp.x - x;
        const dy = sp.y - y;
        const d = Math.max(Math.hypot(dx, dy), 1);
        const force = Math.max(0, 10 - d / 35);
        sp.vx += (dx / d) * force;
        sp.vy += (dy / d) * force;
      });

      showMessage("重力波だ！");
    }

    function update(dt) {
      world.time += dt;

      world.dayTimer += dt;

      if (world.dayTimer > 18000) {
        world.dayTimer = 0;

        world.stats = {
          sixpack: 0,
          wakuVisits: 0,
          spikesGone: 0,
          focusCounts: {}
        };

        showMessage("あたらしい宇宙の日");
      }

      /*
      world.phaseTimer += dt;

      if (world.phase === "gather" && world.phaseTimer > world.gatherDuration) {
        world.phase = "free";
        world.phaseTimer = 0;
        showMessage("それぞれの時間");
      }

      if (world.phase === "free" && world.phaseTimer > world.freeDuration) {
        world.phase = "gather";
        world.phaseTimer = 0;
        showMessage("みんな、あつまる時間");
      }
      */

      updateWaku(dt);


      world.wind.x *= 0.94;
      world.wind.y *= 0.94;
      world.shake *= 0.86;

      foods.forEach(food => food.life--);
      for (let i = foods.length - 1; i >= 0; i--) {
        if (foods[i].life <= 0) foods.splice(i, 1);
      }

      updateSpikes(dt);

      for (const ch of characters) {
        // 下向き重力はやめる。かわりに、ゆるく中心へ戻る力を入れて画面外へ散りすぎないようにする。
        //ch.vx += (world.width * 0.5 - ch.x) * 0.00025;
        //ch.vy += (world.height * 0.47 - ch.y) * 0.00025;
        if (ch.mood !== "paaku" && world.waku.active) {
          //const dx = world.waku.x - ch.x;
          //const dy = world.waku.y - ch.y;
          const centerX = world.spaceWidth * 0.5;
          const centerY = world.spaceHeight * 0.5;

          const dx = centerX - ch.x;
          const dy = centerY - ch.y;

          const d = Math.max(Math.hypot(dx, dy), 40);

          const range = 1100;
          const influence = Math.max(0, 1 - d / range);

          // 遠いほど補正を強くする。ただし暴走防止で上限あり
          const farBoost = Math.min(d / 260, 2.2);

          // 近距離では貼りつきを弱める
          const nearBrake = Math.min(d / 180, 1);

          // =====================
          // 前半だけ引力を持つ
          // =====================

          const p = world.waku.timer / world.waku.duration;

          const fade =
            p < 0.42
              ? 1
              : p < 0.52
                ? 1 - (p - 0.42) / 0.10
                : 0;

          // =====================

          const pull = world.waku.strength * influence * farBoost * nearBrake * fade / d;
          const swirl = world.waku.swirl * influence * farBoost * fade / d;

          ch.vx += dx * pull * dt;
          ch.vy += dy * pull * dt;

          ch.vx += -dy * swirl * dt;
          ch.vy +=  dx * swirl * dt;
        }

        if (ch.mood === "naririn") {
          updateNaririn(ch);
        }
        if (ch.mood === "tahirin") {
        updateTahirin(ch);
        }

        if (ch.mood === "jump" && Math.random() < 0.018) {
        ch.vx += (Math.random() - 0.5) * 1.4;
        ch.vy += (Math.random() - 0.5) * 1.4;
        }

        if (ch.mood === "kussu") {
          updateKussu(ch);
        }

        if (ch.mood === "paaku") {
          updatePaaku(ch);
        }

        if (ch.mood === "tahhi") {
          updateTahhi(ch);
        }
        if (ch.mood === "float") {
          ch.vx += Math.sin(world.time * 0.025 + ch.y * 0.03) * 0.018;
          ch.vy += Math.cos(world.time * 0.035 + ch.x * 0.02) * 0.018;
        }
        if (ch.mood === "slow") {
          ch.vx += Math.sin(world.time * 0.018 + ch.x * 0.01) * 0.008;
          ch.vy += Math.cos(world.time * 0.02 + ch.y * 0.01) * 0.008;
          ch.vx *= 0.992;
          ch.vy *= 0.992;
        }
        if (ch.mood === "sticky") {
          ch.vx += Math.sin(world.time * 0.03) * 0.014;
          ch.vy *= 0.985;
        }
        if (ch.mood === "jump" && Math.random() < 0.018) {
          ch.vx += (Math.random() - 0.5) * 1.4;
          ch.vy += (Math.random() - 0.5) * 1.4;
        }
        if (ch.mood === "heavy") {
          ch.vx += Math.sin(world.time * 0.012) * 0.006;
          ch.vy += Math.cos(world.time * 0.014) * 0.006;
        }

        // 生き物っぽい微細なゆらぎ
        ch.vx += (Math.random() - 0.5) * world.drift;
        ch.vy += (Math.random() - 0.5) * world.drift;

        for (const food of foods) {
          const dx = food.x - ch.x;
          const dy = food.y - ch.y;
          const d = Math.max(Math.hypot(dx, dy), 1);
          if (d < 170) {
            ch.vx += dx / d * 0.035;
            ch.vy += dy / d * 0.025;
          }
        }

        ch.x += (ch.vx + world.wind.x * 0.18) * dt;
        ch.y += (ch.vy + world.wind.y * 0.12) * dt;

        ch.vx *= Math.pow(0.992, dt);//0.985
        ch.vy *= Math.pow(0.992, dt);//0.985

        //if (ch.x < ch.r) { ch.x = ch.r; ch.vx *= -0.65; if (ch.dir) ch.dir = 1; }
        //if (ch.x > world.width - ch.r) { ch.x = world.width - ch.r; ch.vx *= -0.65; if (ch.dir) ch.dir = -1; }
        //if (ch.y < 88 + ch.r) { ch.y = 88 + ch.r; ch.vy *= -0.55; }
        //if (ch.y > world.groundY - ch.r) { ch.y = world.groundY - ch.r; ch.vy *= -0.55; }

        if (ch.mood === "paaku") {
          // パークーは反射しない（通過）
        } else {
          // ■ ゆるい壁（反射じゃない）
          const margin = 40;

          if (ch.x < margin) {
            ch.vx += (margin - ch.x) * 0.01;
          }
          if (ch.x > world.spaceWidth - margin) {
            ch.vx += (world.spaceWidth - margin - ch.x) * 0.01;
          }
          if (ch.y < margin) {
            ch.vy += (margin - ch.y) * 0.01;
          }
          if (ch.y > world.spaceHeight - margin) {
            ch.vy += (world.spaceHeight - margin - ch.y) * 0.01;
          }
        }

        for (const stone of stones) {
          const dx = ch.x - stone.x;
          const dy = ch.y - stone.y;
          const d = Math.max(Math.hypot(dx, dy), 1);
          const minD = ch.r + stone.r;
          if (d < minD) {
            const nx = dx / d;
            const ny = dy / d;
            const push = minD - d;
            ch.x += nx * push;
            ch.y += ny * push;
            ch.vx += nx * 0.8;
            ch.vy += ny * 0.8;
          }
        }

        if (ch.mood !== "paaku") {
          if (
            ch.x < -120 ||
            ch.x > world.spaceWidth + 120 ||
            ch.y < -120 ||
            ch.y > world.spaceHeight + 120
          ) {
            ch.x = world.spaceWidth * 0.5 + (Math.random() - 0.5) * 120;
            ch.y = world.spaceHeight * 0.45 + (Math.random() - 0.5) * 120;
            ch.vx *= 0.3;
            ch.vy *= 0.3;
          }
        }
      }

      for (let i = 0; i < characters.length; i++) {
        for (let j = i + 1; j < characters.length; j++) {
          collide(characters[i], characters[j]);
        }
      }

      checkSixpackEvent();
    }


    function getResidentSpread() {
      const residents = characters.filter(ch => ch.mood !== "paaku");

      const cx = residents.reduce((s, ch) => s + ch.x, 0) / residents.length;
      const cy = residents.reduce((s, ch) => s + ch.y, 0) / residents.length;

      return residents.reduce((s, ch) => {
        return s + Math.hypot(ch.x - cx, ch.y - cy);
      }, 0) / residents.length;
    }

    function getResidentsCenter() {
      const residents = characters.filter(ch => ch.mood !== "paaku");

      return {
        x: residents.reduce((s, ch) => s + ch.x, 0) / residents.length,
        y: residents.reduce((s, ch) => s + ch.y, 0) / residents.length
      };
    }


    function randomOuterPoint(side) {
      const m = 220;

      if (side === 0) {
        return { x: -m, y: Math.random() * world.spaceHeight };
      }
      if (side === 1) {
        return { x: world.spaceWidth + m, y: Math.random() * world.spaceHeight };
      }
      if (side === 2) {
        return { x: Math.random() * world.spaceWidth, y: -m };
      }

      return {
        x: Math.random() * world.spaceWidth,
        y: world.spaceHeight + m
      };
    }

    function startWakuVisit() {
      const w = world.waku;

      w.active = true;
      w.timer = 0;
      w.duration = 2400 + Math.random() * 1400;

      const sideA = Math.floor(Math.random() * 4);
      const sideB = (sideA + 2 + Math.floor(Math.random() * 2)) % 4;

      const a = randomOuterPoint(sideA);
      const b = randomOuterPoint(sideB);

      w.startX = a.x;
      w.startY = a.y;
      w.endX = b.x;
      w.endY = b.y;

      // 宇宙の中心付近を必ず通過させる
      const center = {
        x: world.spaceWidth * 0.5,
        y: world.spaceHeight * 0.5
      };

      w.curveX = center.x + (Math.random() - 0.5) * 80;
      w.curveY = center.y + (Math.random() - 0.5) * 80;

      w.strength = 0.030 + Math.random() * 0.018;
      w.swirl = 0.008 + Math.random() * 0.010;

      world.stats.wakuVisits++;
      showMessage("わく惑星が近づいてきた");
    }

    function updateWaku(dt) {
      const w = world.waku;

      if (!w.active) {
        w.wait -= dt;

        if (w.wait <= 0) {
          if (getResidentSpread() > 180) {
            startWakuVisit();
          } else {
            w.wait = 180;
          }
        }

        return;
      }

      w.timer += dt;

      const p = Math.min(w.timer / w.duration, 1);
      const ease = p * p * (3 - 2 * p);

      const ax = lerp(w.startX, w.curveX, ease);
      const ay = lerp(w.startY, w.curveY, ease);

      const bx = lerp(w.curveX, w.endX, ease);
      const by = lerp(w.curveY, w.endY, ease);

      w.x = lerp(ax, bx, ease);
      w.y = lerp(ay, by, ease);

      if (p >= 1) {
        w.active = false;
        w.wait = 900 + Math.random() * 1800;
      }
    }

    function updateTahhi(ch) {
      // タッヒーは「漂う丸」ではなく、少し考えて、止まり、向きを変え、すばやく進む。
      ch.actionTimer--;
      ch.antenna = Math.sin(world.time * 0.18) * 0.6;

      if (ch.actionTimer <= 0) {
        const roll = Math.random();
        if (roll < 0.35) {
          ch.action = "pause";
          ch.actionTimer = 35 + Math.random() * 70;
        } else if (roll < 0.75) {
          ch.action = "walk";
          ch.actionTimer = 55 + Math.random() * 95;
          ch.dir = Math.random() < 0.5 ? -1 : 1;
        } else {
          ch.action = "dash";
          ch.actionTimer = 20 + Math.random() * 35;
          ch.dir = Math.random() < 0.5 ? -1 : 1;
        }
      }

      if (ch.action === "pause") {
        ch.vx *= 0.94;
        ch.vy *= 0.94;
      }
      if (ch.action === "walk") {
        ch.vx += ch.dir * 0.045;
        ch.vy += Math.sin(world.time * 0.22) * 0.018;
      }
      if (ch.action === "dash") {
        ch.vx += ch.dir * 0.14;
        ch.vy += Math.sin(world.time * 0.45) * 0.05;
      }
    }

    function updateNaririn(ch) {
      const t = world.time;

      ch.vx += Math.sin(t * 0.018 + ch.y * 0.025) * 0.018;
      ch.vy += Math.cos(t * 0.021 + ch.x * 0.022) * 0.018;

      ch.vx *= 0.988;
      ch.vy *= 0.988;

      if (Math.random() < 0.012) {
        ch.vx += (Math.random() - 0.5) * 0.8;
        ch.vy += (Math.random() - 0.5) * 0.8;
        ch.softness = 1;
      }

      ch.softness *= 0.94;
      ch.feeler = Math.sin(t * 0.12 + ch.x * 0.02);

      for (const other of characters) {
        if (other === ch) continue;
        const dx = other.x - ch.x;
        const dy = other.y - ch.y;
        const d = Math.max(Math.hypot(dx, dy), 1);
        if (d < 135) {
          ch.vx += (dx / d) * 0.012;
          ch.vy += (dy / d) * 0.012;
        }
      }
    }

    function updateTahirin(ch) {
      // タヒりんはロボット。カクカク動いて、急に止まり、直角に方向転換する。
      ch.robotTimer--;

      if (ch.robotTimer <= 0) {
        const dirs = [
          { x: 1, y: 0 },
          { x: -1, y: 0 },
          { x: 0, y: 1 },
          { x: 0, y: -1 },
          { x: 0, y: 0 },
        ];

        const next = dirs[Math.floor(Math.random() * dirs.length)];
        ch.dirX = next.x;
        ch.dirY = next.y;
        ch.robotTimer = 35 + Math.random() * 55;

        // 方向転換時にちょっと点滅
        ch.blink = 1;
      }

      ch.blink *= 0.86;

      // 速度をじわっと変えず、目標速度へ機械的に寄せる
      const speed = 0.85;
      const targetVx = ch.dirX * speed;
      const targetVy = ch.dirY * speed;

      ch.vx += (targetVx - ch.vx) * 0.22;
      ch.vy += (targetVy - ch.vy) * 0.22;

      // ときどき短いブースト
      if (Math.random() < 0.006) {
        ch.vx += ch.dirX * 1.4;
        ch.vy += ch.dirY * 1.4;
        ch.blink = 1;
      }
    }

    function updateTaitai(ch) {
    // たいたいは、一定リズムでぴょんぴょんする。
    ch.hopTimer--;

    if (ch.hopTimer <= 0) {
      const angle = Math.random() * Math.PI * 2;
      const power = 1.7 + Math.random() * 1.3;

      ch.vx += Math.cos(angle) * power * 0.55;
      ch.vy += Math.sin(angle) * power * 0.55;

      ch.hopTimer = 22 + Math.random() * 32;
      ch.squash = 1;
    }

    // 跳ねた後に少しだけぷるぷる戻る
    ch.squash *= 0.86;

    // ぴょんぴょん感を出すため、速度は少し保つ
    ch.vx *= 0.992;
    ch.vy *= 0.992;
    }

    function updateKussu(ch) {
      const t = world.time;

      // とにかくゆっくり、ゆらゆら。
      ch.vx += Math.sin(t * 0.012 + ch.y * 0.02) * 0.006;
      ch.vy += Math.cos(t * 0.014 + ch.x * 0.018) * 0.006;

      // たまに、寝返りみたいに向きが変わる。
      if (Math.random() < 0.004) {
        ch.vx += (Math.random() - 0.5) * 0.45;
        ch.vy += (Math.random() - 0.5) * 0.45;
        ch.sleep = 1;
      }

      // かなり減速するので、他の子よりのんびり。
      ch.vx *= 0.982;
      ch.vy *= 0.982;

      ch.sway = Math.sin(t * 0.055 + ch.x * 0.01);
      ch.sleep *= 0.94;
    }

    function updatePaaku(ch) {
      const t = world.time;

      // ■ 基本は一直線（流星）
      const speed = 2.6; // ←ここで速さ調整

      const angle = Math.atan2(ch.vy, ch.vx);
      ch.vx = Math.cos(angle) * speed;
      ch.vy = Math.sin(angle) * speed;

      // ■ わずかに揺れる（宇宙っぽさ）
      ch.vx += Math.sin(t * 0.04) * 0.05;
      ch.vy += Math.cos(t * 0.05) * 0.05;

      // ■ 周囲に流れを作る（弱めると自然）
      for (const other of characters) {
        if (other === ch) continue;
        const dx = other.x - ch.x;
        const dy = other.y - ch.y;
        const d = Math.max(Math.hypot(dx, dy), 1);

        if (d < 100) {
          other.vx += dx / d * 0.015;
          other.vy += dy / d * 0.015;
        }
      }

      // ■ 画面外で再出現
      if (
        ch.x > world.spaceWidth + 120 ||
        ch.x < -120 ||
        ch.y > world.spaceHeight + 120 ||
        ch.y < -120
      ) {
        respawnPaaku(ch);
      }
    }

    function respawnPaaku(ch) {
      const side = Math.floor(Math.random() * 4);

      if (side === 0) {
        ch.x = -100;
        ch.y = Math.random() * world.spaceHeight;
      } else if (side === 1) {
        ch.x = world.spaceWidth + 100;
        ch.y = Math.random() * world.spaceHeight;
      } else if (side === 2) {
        ch.x = Math.random() * world.spaceWidth;
        ch.y = -100;
      } else {
        ch.x = Math.random() * world.spaceWidth;
        ch.y = world.spaceHeight + 100;
      }

      const targetX = world.spaceWidth * Math.random();
      const targetY = world.spaceHeight * Math.random();

      const angle = Math.atan2(targetY - ch.y, targetX - ch.x);

      ch.vx = Math.cos(angle) * 1.2;
      ch.vy = Math.sin(angle) * 1.2;
    }

    function collide(a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.max(Math.hypot(dx, dy), 1);
      const minD = a.r + b.r;
      if (d < minD) {
        const nx = dx / d;
        const ny = dy / d;
        const push = (minD - d) / 2;
        a.x -= nx * push;
        a.y -= ny * push;
        b.x += nx * push;
        b.y += ny * push;

        const bounce = 0.045;
        a.vx -= nx * bounce;
        a.vy -= ny * bounce;
        b.vx += nx * bounce;
        b.vy += ny * bounce;
      }
    }

    let lastSixpack = 0;
    function checkSixpackEvent() {
      const cx = characters.reduce((s, ch) => s + ch.x, 0) / characters.length;
      const cy = characters.reduce((s, ch) => s + ch.y, 0) / characters.length;
      const spread = characters.reduce((s, ch) => s + Math.hypot(ch.x - cx, ch.y - cy), 0) / characters.length;

      if (spread < 82 && world.time - lastSixpack > 240) {
        lastSixpack = world.time;
        world.shake = 18;
        world.stats.sixpack++;
        showMessage("シックスパックになりたい〜!!");

        characters.forEach((ch, i) => {
          if (ch.mood === "paaku") return; // パークーは方向リセットしない

          const angle = (Math.PI * 2 / characters.length) * i;
          ch.vx += Math.cos(angle) * 4.5;
          ch.vy += Math.sin(angle) * 4.5 - 2;
        });
      }
    }

    function draw() {
      updateCamera();

      const sx = (Math.random() - 0.5) * world.shake;
      const sy = (Math.random() - 0.5) * world.shake;

      // ① 遠景：画面に固定された深い宇宙。ズームしない。
      drawFarBackground();

      ctx.save();
      ctx.translate(sx, sy);

      // ② ここから先は、カメラでのぞく「広い宇宙」。
      applyCamera();

      // ③ 近景：星雲・近い星。キャラや置いた星と一緒にズームする。
      drawWorldBackground();

      stones.forEach(drawStone);
      foods.forEach(drawFood);
      spikes.forEach(drawSpike);
      characters.forEach(drawCharacter);

      ctx.restore();

      if (world.statsOpen) {
        drawTodayCard();
      }

      if (!world.started) {
        drawTitleScreen();
      }
    }

    function updateCamera() {
      if (world.cameraMode === "focus" && world.focusTarget) {
        const t = world.focusTarget;

        world.camera.x = lerp(world.camera.x, t.x, 0.12);
        world.camera.y = lerp(world.camera.y, t.y, 0.12);

        world.camera.targetZoom = 1.18;
        world.camera.zoom = lerp(world.camera.zoom, world.camera.targetZoom, 0.08);

        world.focusTimer--;

        if (world.focusTimer <= 0) {
          world.cameraMode = "auto";
          world.focusTarget = null;
        }

        const halfW = world.width / (2 * world.camera.zoom);
        const halfH = world.height / (2 * world.camera.zoom);
        world.camera.x = clamp(world.camera.x, halfW, world.spaceWidth - halfW);
        world.camera.y = clamp(world.camera.y, halfH, world.spaceHeight - halfH);

        return;
      }

      // パークーは通過者なので、カメラの中心計算から外す。
      const residents = characters.filter(ch => ch.mood !== "paaku");
      if (residents.length === 0) return;

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      let sumX = 0, sumY = 0;

      for (const ch of residents) {
        minX = Math.min(minX, ch.x - ch.r);
        maxX = Math.max(maxX, ch.x + ch.r);
        minY = Math.min(minY, ch.y - ch.r);
        maxY = Math.max(maxY, ch.y + ch.r);
        sumX += ch.x;
        sumY += ch.y;
      }

      const wakuP = world.waku.timer / world.waku.duration;

      const wakuCameraActive =
        world.waku.active &&
        wakuP < 0.52;

      if (wakuCameraActive) {
        const w = world.waku;
        const wr = w.r * 1.7;

        minX = Math.min(minX, w.x - wr);
        maxX = Math.max(maxX, w.x + wr);
        minY = Math.min(minY, w.y - wr);
        maxY = Math.max(maxY, w.y + wr);

        sumX += w.x;
        sumY += w.y;
      }

      //const cx = sumX / residents.length;
      //const cy = sumY / residents.length;
      //const count = residents.length + (world.waku.active ? 1 : 0);
      const count = residents.length + (wakuCameraActive ? 1 : 0);
      const cx = sumX / count;
      const cy = sumY / count;

      const spanX = Math.max(maxX - minX, 160);
      const spanY = Math.max(maxY - minY, 160);

      // 広がったら引く、集まったら寄る。余白を多めにして宇宙感を残す。
      const zoomX = world.width / (spanX + 220);
      const zoomY = world.height / (spanY + 260);
      const targetZoom = clamp(Math.min(zoomX, zoomY), world.zoomMin, world.zoomMax);

      world.camera.x = lerp(world.camera.x, cx, 0.045);
      world.camera.y = lerp(world.camera.y, cy, 0.045);
      world.camera.targetZoom = targetZoom;
      world.camera.zoom = lerp(world.camera.zoom, targetZoom, 0.04);

      // カメラが宇宙の外を見すぎないようにする。
      const halfW = world.width / (2 * world.camera.zoom);
      const halfH = world.height / (2 * world.camera.zoom);
      world.camera.x = clamp(world.camera.x, halfW, world.spaceWidth - halfW);
      world.camera.y = clamp(world.camera.y, halfH, world.spaceHeight - halfH);
    }

    function applyCamera() {
      ctx.translate(world.width / 2, world.height / 2);
      ctx.scale(world.camera.zoom, world.camera.zoom);
      ctx.translate(-world.camera.x, -world.camera.y);
    }
    function drawFarBackground() {
      // 遠景：カメラズームの影響を受けない、深い宇宙の下地。
      const g = ctx.createLinearGradient(0, 0, world.width, world.height);
      g.addColorStop(0, "#171032");
      g.addColorStop(0.34, "#16214b");
      g.addColorStop(0.68, "#0f3140");
      g.addColorStop(1, "#242235");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, world.width, world.height);

      // 遠い星。固定レイヤーなので、ズームアウトしても奥行きが残る。
      for (const s of farStars) {
        const x = s.x * world.width;
        const y = s.y * world.height;
        const twinkle = 0.45 + Math.sin(world.time * 0.035 + s.tw) * 0.32;

        ctx.beginPath();
        ctx.arc(x, y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${twinkle})`;
        ctx.fill();
      }
    }

    

    function drawWorldBackground() {
      // ランダム生成された星雲
      for (const n of world.nebulas) {
        drawNebula(n.x, n.y, n.r, n.color);
      }

      // 広い宇宙に散った近い星。ズームアウト時に「空間の広さ」が見える。
      for (const s of worldStars) {
        const x = s.x * world.spaceWidth;
        const y = s.y * world.spaceHeight;
        const twinkle = 0.46 + Math.sin(world.time * 0.04 + s.tw) * 0.30;

        ctx.beginPath();
        ctx.arc(x, y, s.r, 0, Math.PI * 2);
        const tint = s.hue < 0.33 ? "255,255,255" : s.hue < 0.66 ? "210,235,255" : "255,225,245";
        ctx.fillStyle = `rgba(${tint},${twinkle})`;
        ctx.fill();

        if (s.r > 2.3) {
          ctx.strokeStyle = `rgba(255,255,255,${twinkle * 0.38})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x - s.r * 2.2, y);
          ctx.lineTo(x + s.r * 2.2, y);
          ctx.moveTo(x, y - s.r * 2.2);
          ctx.lineTo(x, y + s.r * 2.2);
          ctx.stroke();
        }
      }

      // ふわっと流れる前景星。既存の bubbles を宇宙座標に変換して使う。
      drawWakuPlanet();

      for (const b of bubbles) {
        b.y -= b.speed * 0.2;
        b.x += Math.sin(world.time * 0.01 + b.y * 0.02) * 0.1;

        if (b.y < 0) {
          b.y = world.spaceHeight;
          b.x = Math.random() * world.spaceWidth;
        }

        // 初期値が画面サイズ基準でも、描画時は広い宇宙内に散らす。
        const x = (b.x % world.spaceWidth + world.spaceWidth) % world.spaceWidth;
        const y = (b.y % world.spaceHeight + world.spaceHeight) % world.spaceHeight;
        drawTinyStar(x, y, b.r * 1.1);
      }
    }

    function drawWakuPlanet() {
      if (!world.waku.active) return;

      const w = world.waku;

      ctx.save();
      ctx.translate(w.x, w.y);

      const img = images.wakuwaku;

      // ぷるん感
      const pulse =
        1 + Math.sin(world.time * 0.002 + w.timer * 0.01) * 0.035;

      ctx.scale(pulse, pulse);

      const size = w.r * 3.2;

      // 発光
      ctx.shadowColor = "rgba(255,220,120,0.45)";
      ctx.shadowBlur = 28;

      if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(
          img,
          -size / 2,
          -size / 2,
          size,
          size
        );
      }

      ctx.restore();
    }

    function drawNebula(x, y, r, color) {
      const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
      grad.addColorStop(0, color);
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawTinyStar(x, y, r) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(world.time * 0.01 + x);
      ctx.strokeStyle = "rgba(255,255,255,0.72)";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(-r, 0);
      ctx.lineTo(r, 0);
      ctx.moveTo(0, -r);
      ctx.lineTo(0, r);
      ctx.stroke();
      ctx.restore();
    }

    function drawStone(stone) {
      ctx.beginPath();
      ctx.arc(stone.x, stone.y, stone.r, 0, Math.PI * 2);
      ctx.fillStyle = "#8f8a82";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(stone.x - stone.r * 0.25, stone.y - stone.r * 0.25, stone.r * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.22)";
      ctx.fill();
    }

    function drawFood(food) {
      ctx.save();
      ctx.translate(food.x, food.y);
      ctx.rotate(world.time * 0.04);
      const glow = food.r + 8 + Math.sin(world.time * 0.12) * 3;

      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, glow);
      grad.addColorStop(0, "rgba(255,255,255,0.95)");
      grad.addColorStop(0.45, "rgba(255,130,190,0.45)");
      grad.addColorStop(1, "rgba(255,130,190,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, glow, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-food.r, 0);
      ctx.lineTo(food.r, 0);
      ctx.moveTo(0, -food.r);
      ctx.lineTo(0, food.r);
      ctx.stroke();
      ctx.restore();
    }

    function shouldShowName(ch) {
      if (!world.started) return true;
      if (world.cameraMode === "focus" && world.focusTarget === ch) return true;
      return false;
    }

    function drawCharacter(ch) {
      if (ch.mood === "tahhi") {
        drawTahhi(ch);
        if (shouldShowName(ch)) drawName(ch, ch.r + 16, true);
        return;
      }

      if (ch.mood === "naririn") {
        drawNaririn(ch);
        if (shouldShowName(ch)) drawName(ch, ch.r + 20);
        return;
      }

      if (ch.mood === "tahirin") {
        drawTahirin(ch);
        if (shouldShowName(ch)) drawName(ch, ch.r + 18);
        return;
      }

      if (ch.mood === "taitai") {
        drawTaitai(ch);
        if (shouldShowName(ch)) drawName(ch, ch.r + 18);
        return;
      }

      if (ch.mood === "kussu") {
        drawKussu(ch);
        if (shouldShowName(ch)) drawName(ch, ch.r + 18);
        return;
      }

      if (ch.mood === "paaku") {
        drawPaaku(ch);
        if (shouldShowName(ch)) drawName(ch, ch.r + 20);
        return;
      }

      const wobble = Math.sin(world.time * 0.08 + ch.x * 0.04) * 0.08;
      const squash = 1 + Math.sin(world.time * 0.1 + ch.y * 0.03) * 0.045;

      ctx.save();
      ctx.translate(ch.x, ch.y);
      ctx.rotate(ch.vx * 0.04 + wobble);
      ctx.scale(1 / squash, squash);

      ctx.beginPath();
      ctx.arc(0, 0, ch.r, 0, Math.PI * 2);
      ctx.fillStyle = ch.color;
      ctx.fill();

      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(80, 60, 45, 0.5)";
      ctx.stroke();

      ctx.fillStyle = "rgba(255,255,255,0.45)";
      ctx.beginPath();
      ctx.arc(-ch.r * 0.3, -ch.r * 0.35, ch.r * 0.28, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#3f3028";

function drawTahhi(ch) {
  const img = images.tahhi;
  const t = world.time;
  const size = ch.r * 3.2;
  const legColor = ch.legColor || "#b85c78";

  ctx.save();
  ctx.translate(ch.x, ch.y);
  ctx.rotate(ch.vx * 0.025);

  // 画像より先に、短いカニ脚を描く
  ctx.strokeStyle = legColor;
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  const step = Math.sin(t * 0.45);
  const legs = [
    { side: -1, y: -10, phase: 0 },
    { side: -1, y:   2, phase: Math.PI },
    { side: -1, y:  14, phase: 0.7 },

    { side:  1, y: -10, phase: Math.PI },
    { side:  1, y:   2, phase: 0 },
    { side:  1, y:  14, phase: Math.PI + 0.7 },
  ];

  for (const leg of legs) {
    const s = Math.sin(t * 0.5 + leg.phase);

    const rootX = leg.side * ch.r * 0.92;
    const rootY = leg.y;

    const kneeX = leg.side * ch.r * (1.12 + s * 0.05);
    const kneeY = rootY + s * 3;

    const footX = leg.side * ch.r * (1.32 + s * 0.08);
    const footY = rootY + 5 + s * 4;

    ctx.beginPath();
    ctx.moveTo(rootX, rootY);
    ctx.lineTo(kneeX, kneeY);
    ctx.lineTo(footX, footY);
    ctx.stroke();
  }

  // 本体画像
  if (img && img.complete) {
    ctx.drawImage(img, -size / 2, -size / 2, size, size);
  } else {
    ctx.beginPath();
    ctx.arc(0, 0, ch.r, 0, Math.PI * 2);
    ctx.fillStyle = ch.color;
    ctx.fill();
  }

  ctx.restore();
}

function drawNaririn(ch) {
  const t = world.time;
  const img = images.naririn;

  const pulse = Math.sin(t * 0.09 + ch.x * 0.02) * 0.08 + ch.softness * 0.16;
  const wobble = Math.sin(t * 0.16 + ch.y * 0.02) * 0.18;
  const tilt = Math.sin(t * 0.035 + ch.x * 0.01) * 0.22 + ch.vx * 0.025;

  const w = ch.r * 2.9;
  const h = ch.r * 2.25;

  ctx.save();
  ctx.translate(ch.x, ch.y);
  ctx.rotate(tilt);

  // 頭：画像をぷにぷに変形
  ctx.save();
  ctx.scale(1 + pulse, 1 - pulse * 0.45);
  ctx.drawImage(img, -w / 2, -h / 2, w, h);
  ctx.restore();

  // 透明感のための追加ハイライト
  ctx.save();
  ctx.scale(1 + pulse * 0.8, 1 - pulse * 0.35);
  const grad = ctx.createRadialGradient(
    -ch.r * 0.3, -ch.r * 0.35, 2,
    0, 0, ch.r * 1.5
  );
  grad.addColorStop(0, "rgba(255,255,255,0.22)");
  grad.addColorStop(0.55, "rgba(180,230,255,0.08)");
  grad.addColorStop(1, "rgba(120,180,255,0)");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0, -ch.r * 0.05, ch.r * 1.25, ch.r * 0.82, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 足：線画のまま、ゆらゆら
  ctx.strokeStyle = "rgba(210,240,255,0.82)";
  ctx.lineWidth = 3;
  ctx.lineCap = "round";

  for (let i = -2; i <= 2; i++) {
    const baseX = i * ch.r * 0.26;
    const phase = i * 1.3;
    const len = ch.r * (0.72 + (i % 2 === 0 ? 0.18 : 0));

    ctx.beginPath();
    ctx.moveTo(baseX, ch.r * 0.58);
    ctx.quadraticCurveTo(
      baseX + Math.sin(t * 0.12 + phase) * 8,
      ch.r * 0.85 + len * 0.25,
      baseX + Math.sin(t * 0.16 + phase) * 13,
      ch.r * 0.65 + len + wobble * 10
    );
    ctx.stroke();
  }

  ctx.restore();
}

function drawTahirin(ch) {
  const img = images.tahirin;
  const blink = ch.blink || 0;

  // 画像サイズ。大きすぎ/小さすぎはここで調整
  const size = ch.r * 3.4;

  ctx.save();
  ctx.translate(ch.x, ch.y);

  // 機械っぽく、角度をなめらかにせずカクッと決める
  let angle = 0;
  if (Math.abs(ch.dirX) > Math.abs(ch.dirY)) {
    angle = ch.dirX > 0 ? 0 : Math.PI;
  } else if (ch.dirY !== 0) {
    angle = ch.dirY > 0 ? Math.PI / 2 : -Math.PI / 2;
  }

  ctx.rotate(angle);

  // 点滅時に少しだけ光る
  ctx.shadowColor = blink > 0.2
    ? "rgba(255,180,220,0.95)"
    : "rgba(255,210,230,0.45)";
  ctx.shadowBlur = blink > 0.2 ? 18 : 8;

  if (img && img.complete) {
    ctx.drawImage(img, -size / 2, -size / 2, size, size);
  } else {
    // 画像がまだ読めない時の仮表示
    ctx.beginPath();
    ctx.arc(0, 0, ch.r, 0, Math.PI * 2);
    ctx.fillStyle = ch.color;
    ctx.fill();
  }

  ctx.shadowBlur = 0;

  // ロボ感：方向転換の瞬間だけ小さい通信ランプ
  if (blink > 0.15) {
    ctx.beginPath();
    ctx.arc(0, -size * 0.42, 4 + blink * 4, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,120,190,0.85)";
    ctx.fill();
  }

  ctx.restore();
}

function drawTaitai(ch) {
  const img = images.taitai;
  const t = world.time;

  const size = ch.r * 3.0;

  // ふわふわ上下
  const floatY = Math.sin(t * 0.06 + ch.x * 0.02) * ch.r * 0.4;

  // ちょい左右にも漂う
  const floatX = Math.sin(t * 0.04 + ch.y * 0.01) * ch.r * 0.2;

  // ぷにっと伸縮（軽め）
  const squash = Math.sin(t * 0.08) * 0.06;

  // やさしい傾き
  const tilt = Math.sin(t * 0.03 + ch.x * 0.01) * 0.18;

  ctx.save();
  ctx.translate(ch.x + floatX, ch.y + floatY);
  ctx.rotate(tilt);

  ctx.scale(1 + squash, 1 - squash * 0.6);

  // ほんのり発光（ピンク系）
  ctx.shadowColor = "rgba(255,170,200,0.5)";
  ctx.shadowBlur = 12;

  if (img && img.complete) {
    ctx.drawImage(img, -size / 2, -size / 2, size, size);
  } else {
    ctx.beginPath();
    ctx.arc(0, 0, ch.r, 0, Math.PI * 2);
    ctx.fillStyle = ch.color;
    ctx.fill();
  }

  ctx.shadowBlur = 0;

  ctx.restore();
}

function drawKussu(ch) {
  const img = images.kussu;
  const t = world.time;

  // サイズ（ここで調整）
  const size = ch.r * 2.8;

  // ゆっくりしたぷるん変形
  const squash = Math.sin(t * 0.05 + ch.x * 0.01) * 0.08;

  // 微妙な傾き（ほぼ水平を保つ）
  const tilt = Math.sin(t * 0.02 + ch.y * 0.01) * 0.08;

  ctx.save();
  ctx.translate(ch.x, ch.y);
  ctx.rotate(tilt);

  // ゼリーっぽい伸縮
  ctx.scale(1 + squash, 1 - squash * 0.7);

  // ほんのり発光
  ctx.shadowColor = "rgba(255,120,80,0.45)";
  ctx.shadowBlur = 10;

  if (img && img.complete) {
    ctx.drawImage(img, -size / 2, -size / 2, size, size);
  } else {
    // 画像読み込み前の仮表示
    ctx.beginPath();
    ctx.arc(0, 0, ch.r, 0, Math.PI * 2);
    ctx.fillStyle = ch.color;
    ctx.fill();
  }

  ctx.shadowBlur = 0;

  ctx.restore();
}

function drawPaaku(ch) {
  const angle = Math.atan2(ch.vy, ch.vx);
  const t = world.time;
  const img = images.paaku;

  const size = ch.r * 2.4;
  const tailLength = ch.r * 4.2;
  const tailWobble = Math.sin(t * 0.18) * ch.r * 0.25;

  ctx.save();
  ctx.translate(ch.x, ch.y);
  ctx.rotate(angle);

  // 尾：ゲーム側で描く
  const grad = ctx.createLinearGradient(-tailLength, 0, -size * 0.2, 0);
  grad.addColorStop(0, "rgba(255,180,120,0)");
  grad.addColorStop(0.45, "rgba(255,190,140,0.22)");
  grad.addColorStop(1, "rgba(255,210,160,0.65)");

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(-tailLength, tailWobble);
  ctx.quadraticCurveTo(
    -tailLength * 0.55,
    -ch.r * 0.75,
    -size * 0.25,
    -ch.r * 0.35
  );
  ctx.lineTo(-size * 0.25, ch.r * 0.35);
  ctx.quadraticCurveTo(
    -tailLength * 0.55,
    ch.r * 0.85,
    -tailLength,
    tailWobble
  );
  ctx.closePath();
  ctx.fill();

// 尾のしなやかな光の筋 2本
ctx.lineCap = "round";

for (let i = -1; i <= 1; i += 2) {
  ctx.strokeStyle = "rgba(255,235,180,0.36)";
  ctx.lineWidth = 1.8;

  const wave1 = Math.sin(t * 0.22 + i) * ch.r * 0.24;
  const wave2 = Math.sin(t * 0.29 + i * 1.5) * ch.r * 0.20;

  ctx.beginPath();
  ctx.moveTo(-tailLength, tailWobble + i * ch.r * 0.18 + wave1);
  ctx.bezierCurveTo(
    -tailLength * 0.78,
    i * ch.r * 0.15 + wave2,
    -tailLength * 0.48,
    i * ch.r * -0.12 - wave1,
    -size * 0.25,
    i * ch.r * 0.08
  );
  ctx.stroke();
}

  // 顔PNG
  if (img && img.complete) {
    ctx.drawImage(img, -size / 2, -size / 2, size, size);
  } else {
    // 画像がまだ読めないときの仮表示
    ctx.beginPath();
    ctx.arc(0, 0, ch.r, 0, Math.PI * 2);
    ctx.fillStyle = ch.color;
    ctx.fill();
  }

  ctx.restore();
}


function updateSpikes(dt) {
  // 自然発生。多すぎないように最大6個まで。
  if (spikes.length < 6 && Math.random() < 0.006 * dt) {
    spikes.push(createSpike());
  }

  for (const sp of spikes) {
    sp.life -= dt;

    // ゆっくり漂う。少しだけ意思があるように揺れる。
    sp.vx += Math.sin(world.time * 0.02 + sp.y * 0.01) * 0.01 * dt;
    sp.vy += Math.cos(world.time * 0.018 + sp.x * 0.01) * 0.01 * dt;

    sp.x += sp.vx * dt;
    sp.y += sp.vy * dt;

    sp.vx *= Math.pow(0.988, dt);
    sp.vy *= Math.pow(0.988, dt);

    // 宇宙の端では軽く戻す。
    const margin = 30;
    if (sp.x < margin) sp.vx += (margin - sp.x) * 0.01;
    if (sp.x > world.spaceWidth - margin) sp.vx += (world.spaceWidth - margin - sp.x) * 0.01;
    if (sp.y < margin) sp.vy += (margin - sp.y) * 0.01;
    if (sp.y > world.spaceHeight - margin) sp.vy += (world.spaceHeight - margin - sp.y) * 0.01;

    // キャラとの反応。クッスーだけが吸収できる。
    for (const ch of characters) {
      if (ch.mood === "paaku") continue;

      const dx = ch.x - sp.x;
      const dy = ch.y - sp.y;
      const d = Math.max(Math.hypot(dx, dy), 1);
      const hit = ch.r + sp.r;

      if (d < hit) {
        if (ch.mood === "kussu") {
          sp.life = 0;
          ch.sleep = 1;
          showMessage("クッスーがイガイガを吸収した");
        } else {
          ch.vx += (dx / d) * 1.8;
          ch.vy += (dy / d) * 1.8;
          sp.vx -= (dx / d) * 0.9;
          sp.vy -= (dy / d) * 0.9;
        }
      }
    }
  }

  // イガイガ同士がぶつかったら両方消える。
  for (let i = 0; i < spikes.length; i++) {
    for (let j = i + 1; j < spikes.length; j++) {
      const a = spikes[i];
      const b = spikes[j];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.hypot(dx, dy);

      if (d < a.r + b.r) {
        a.life = 0;
        b.life = 0;
        world.stats.spikesGone += 2;
        showMessage("イガイガどうしが消えた");
      }
    }
  }

  for (let i = spikes.length - 1; i >= 0; i--) {
    if (spikes[i].life <= 0) {
      spikes.splice(i, 1);
    }
  }
}

function createSpike() {
  return {
    x: Math.random() * world.spaceWidth,
    y: Math.random() * world.spaceHeight,
    r: 14 + Math.random() * 8,
    vx: (Math.random() - 0.5) * 1.2,
    vy: (Math.random() - 0.5) * 1.2,
    life: 900 + Math.random() * 600,
    spin: Math.random() * Math.PI * 2,
  };
}

function drawSpike(sp) {
  const img = images.spike;
  const t = world.time;

  const size = sp.r * 3.2;

  // トゲっぽい脈動
  const pulse = 1 + Math.sin(t * 0.12 + sp.x) * 0.12;

  ctx.save();
  ctx.translate(sp.x, sp.y);

  // 少しだけ回転（危険感）
  ctx.rotate(sp.spin + t * 0.04);

  // ギザギザが伸び縮みする感じ
  ctx.scale(pulse, pulse);

  // 紫のオーラ（やりすぎない）
  ctx.shadowColor = "rgba(170,120,255,0.55)";
  ctx.shadowBlur = 14;

  if (img && img.complete) {
    ctx.drawImage(img, -size / 2, -size / 2, size, size);
  } else {
    // 読み込み前の仮表示
    ctx.beginPath();
    ctx.arc(0, 0, sp.r, 0, Math.PI * 2);
    ctx.fillStyle = "purple";
    ctx.fill();
  }

  ctx.shadowBlur = 0;

  ctx.restore();
}

function drawTitleScreen() {

  // 背景を少し暗くして、ロゴを前面に出す

  const pop = 1 + Math.sin(t * 0.05) * 0.028;

  ctx.translate(x, y);

function roundedRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}


function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function getTodayStar() {
  const entries = Object.entries(world.stats.focusCounts);

  if (entries.length === 0) {
    return "まだいない";
  }

  entries.sort((a, b) => b[1] - a[1]);

  return entries[0][0];
}

function drawTodayCard() {
  const w = Math.min(world.width * 0.84, 330);
  const h = 245;

  const x = world.width * 0.5 - w * 0.5;
  const y = world.height * 0.5 - h * 0.5 - 40;

  ctx.save();

  ctx.globalAlpha = 1;

  ctx.fillStyle = "rgba(255,255,255,0.26)";
  roundRect(ctx, x, y, w, h, 28);
  ctx.fill();

  ctx.fillStyle = "rgba(255,255,255,0.10)";
  roundRect(ctx, x + 6, y + 6, w - 12, h - 12, 22);
  ctx.fill();

  ctx.lineWidth = 2.5;
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.stroke();

  const grad = ctx.createLinearGradient(x, y, x, y + h * 0.4);
  grad.addColorStop(0, "rgba(255,255,255,0.34)");
  grad.addColorStop(1, "rgba(255,255,255,0)");

  ctx.fillStyle = grad;
  roundRect(ctx, x, y, w, h * 0.48, 28);
  ctx.fill();

  ctx.fillStyle = "rgba(255,255,255,0.92)";
  ctx.font = "700 24px system-ui";
  ctx.textAlign = "center";

  ctx.fillText("きょうの宇宙", x + w / 2, y + 42);

  ctx.textAlign = "left";
  ctx.font = "700 17px system-ui";

  const star = getTodayStar();

  const lines = [
    `きょうの主役　${star}`,
    `わく惑星　${world.stats.wakuVisits}回`,
    `シックスパック　${world.stats.sixpack}回`,
    `イガイガ消滅　${world.stats.spikesGone}個`
  ];

  lines.forEach((line, i) => {
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.fillText(line, x + 30, y + 92 + i * 34);
  });

  const remain = Math.max(0, Math.ceil((18000 - world.dayTimer) / 60));

  ctx.font = "600 13px system-ui";
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(255,255,255,0.75)";

  ctx.fillText(
    `次の宇宙の日まで ${remain}秒`,
    x + w / 2,
    y + h - 24
  );

  ctx.restore();
}
